name: Vector Search runtime benchmark CI

on:
  pull_request:
    paths:
      - "benchmarks/vector_search_runtime/**"
      - "training/generation_contract.py"
      - "pipelines/promote.py"
      - ".github/workflows/vector-search-runtime-ci.yml"
  push:
    branches: [main]
    paths:
      - "benchmarks/vector_search_runtime/**"
      - "training/generation_contract.py"
      - "pipelines/promote.py"
      - ".github/workflows/vector-search-runtime-ci.yml"

permissions:
  contents: read

jobs:
  unit-tests-no-cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: benchmarks/vector_search_runtime/requirements.txt
      - name: Install pinned runtime client
        run: python -m pip install --disable-pip-version-check -r benchmarks/vector_search_runtime/requirements.txt
      - name: Check resolved dependency compatibility
        run: python -m pip check
      - name: Validate JSON schemas
        run: |
          python -m json.tool benchmarks/vector_search_runtime/input.schema.json >/dev/null
          python -m json.tool benchmarks/vector_search_runtime/result.schema.json >/dev/null
          python -m json.tool benchmarks/vector_search_runtime/diagnostic.schema.json >/dev/null
      - name: Compile harness
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m py_compile benchmarks/vector_search_runtime/runtime_benchmark.py
      - name: Run injected-endpoint unit tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONHASHSEED: "0"
        run: python -m unittest discover -s benchmarks/vector_search_runtime/tests -v
